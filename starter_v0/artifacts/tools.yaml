# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng 1 câu để lấy thông tin còn thiếu, sau đó dừng và chờ họ trả lời. Dùng khi yêu cầu mơ hồ hoặc thiếu tham số bắt buộc (đối tượng, phạm vi, thời gian...). KHÔNG dùng khi đã đủ thông tin, hoặc để xác nhận lại điều người dùng đã nói rõ."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cụ thể, hỏi đúng một thông tin còn thiếu. VD: 'Bạn muốn xem báo cáo của tháng nào?'"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi. text: nhập tự do (mặc định). yes_no: câu hỏi đồng ý/không. choice: chọn trong 'options' (bắt buộc kèm options)."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type='choice': 2-5 lựa chọn ngắn, không trùng nhau. Bỏ trống (hoặc []) với text và yes_no."}
      required: [question]

  - name: timeline
    description: "Lấy các tweet gần đây nhất của một tài khoản X (Twitter) cụ thể, mỗi tweet gồm nội dung, link, ngày đăng và số liệu tương tác (favorites, retweets, views). Dùng khi đã biết chính xác tài khoản cần xem. KHÔNG dùng để tìm tweet theo từ khóa/chủ đề hoặc khi chưa biết tài khoản (dùng social_search hoặc ask_user)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X của tài khoản, KHÔNG có ký tự '@', không phân biệt hoa thường. VD: 'elonmusk', không phải '@elonmusk' hay tên hiển thị."}
        limit: {type: integer, default: 5, description: "Số tweet trả về, từ 1 đến 50. Mặc định 5; chỉ tăng khi người dùng yêu cầu xem nhiều hơn. Chỉ cắt bớt kết quả API, không yêu cầu API trả thêm."}
      required: [screenname]

  - name: social_search
    description: "Tìm tweet công khai trên X (Twitter) theo từ khóa, hashtag hoặc chủ đề, mỗi tweet gồm nội dung, link, ngày đăng và số liệu tương tác (favorites, retweets, views). Dùng khi cần tìm thảo luận/nội dung về một chủ đề hoặc sự kiện mà chưa biết tài khoản cụ thể. KHÔNG dùng khi đã biết tài khoản cần xem (dùng get_user_tweets) hoặc khi yêu cầu còn mơ hồ (dùng ask_user)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm, ngắn gọn 1-6 từ, có thể kèm hashtag hoặc cụm từ trong ngoặc kép. Hỗ trợ toán tử của X: 'from:handle' (tweet của tài khoản), 'since:YYYY-MM-DD' / 'until:YYYY-MM-DD' (khung thời gian). VD: 'AI agent since:2026-11-01', '#tintuc from:vnexpress'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp kết quả. Latest: mới nhất trước (mặc định, dùng cho tin nóng, diễn biến hiện tại). Top: nhiều tương tác nhất (dùng để tìm tweet nổi bật, ý kiến phổ biến). Viết hoa chữ cái đầu đúng như enum."}
        limit: {type: integer, default: 5, description: "Số tweet trả về, từ 1 đến 50. Mặc định 5; chỉ tăng khi người dùng yêu cầu xem nhiều hơn. Chỉ cắt bớt kết quả API, không yêu cầu API trả thêm."}
      required: [query]

  - name: lookup
    description: >-
      Tìm kiếm trên web (Tavily), trả về danh sách bài {title, url, source, summary}.
      DÙNG khi người dùng hỏi tin tức / thông tin trên web về một chủ đề (vd "tin AI hôm nay",
      "tin công nghệ tuần này", "tìm trên web về OpenAI"). Câu nối tiếp sau một câu hỏi tin web
      (vd "còn về robotics thì sao?") vẫn dùng lookup với chủ đề mới, giữ topic và timeframe cũ.
      KHÔNG dùng khi: người dùng đã đưa link cụ thể (dùng fetch); hỏi tweet / mọi người bàn gì
      trên Twitter (dùng social_search hoặc timeline); hỏi paper arXiv (dùng papers); hỏi
      policy công ty (dùng policy); câu ngoài phạm vi research (không gọi tool).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cần tìm, chỉ gồm từ khóa chủ đề (vd 'AI', 'robotics', 'OpenAI'). KHÔNG thêm các chữ 'news', 'tin tức', 'hôm nay' vào query — loại tin và thời gian đã có topic và timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "'news' khi người dùng hỏi tin tức / thời sự / tin mới; 'general' cho tra cứu thông tin chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'hôm nay' -> day, 'tuần này' -> week, 'tháng này' -> month, 'năm nay' -> year. Giữ nguyên timeframe của lượt trước nếu người dùng không đổi."}
        max_results: {type: integer, default: 5, description: "Số kết quả (số nguyên, mặc định 5)."}
      required: [query]

  - name: fetch
    description: >-
      Đọc nội dung của MỘT URL cụ thể (Firecrawl), trả về markdown tối đa 4000 ký tự.
      DÙNG khi người dùng đã đưa link đầy đủ (http/https) trong tin nhắn hoặc ở lượt trước và
      muốn đọc / tóm tắt nó. Nhiều link thì gọi fetch một lần cho mỗi link.
      KHÔNG dùng khi: chưa có link ("tóm tắt bài này" mà không kèm URL) — gọi clarify với
      response_type="text" để xin link, TUYỆT ĐỐI không tự đoán hay bịa URL; cần tìm bài theo chủ đề (dùng lookup);
      link là paper arXiv cần lấy text (dùng paper_text).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, chép nguyên văn từ người dùng (vd 'https://openai.com/blog/gpt-5'). Không sửa, không đoán."}
      required: [url]

  - name: format
    description: >-
      Trình bày các item ĐÃ CÓ (kết quả từ lookup, fetch, timeline, social_search, papers...)
      thành bản tin markdown. Tool này không tìm hay đọc dữ liệu mới.
      DÙNG khi đã có item và người dùng muốn làm bản tin / digest / thread.
      KHÔNG dùng khi: chưa có dữ liệu (gọi tool lấy dữ liệu trước); chỉ trả lời một câu hỏi
      ngắn; muốn gửi đi (format xong, gửi bằng send sau khi người dùng xác nhận).
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn: brief = tối đa 5 gạch đầu dòng có tiêu đề; sections = nhóm theo field section; bullets = danh sách phẳng; thread = đánh số 1/, 2/...; daily_ai_vn = bản tin AI tiếng Việt nhóm theo section."}
        headline: {type: string, default: "", description: "Tiêu đề bản tin (tuỳ chọn)."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi (đăng) một đoạn văn bản lên Telegram channel riêng của nhóm. Đây là HÀNH ĐỘNG GHI,
      không hoàn tác được.
      CHỈ gọi khi người dùng đã xác nhận rõ ràng ("ok gửi đi", "có") cho đúng nội dung đó ở
      lượt trước, và truyền confirmed=true.
      KHÔNG dùng khi: người dùng mới yêu cầu đăng/gửi mà chưa xác nhận — gọi clarify với
      response_type=yes_no để hỏi xác nhận trước; để trả lời câu hỏi; với nội dung ngoài phạm vi
      research (bài toán, code...).
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đúng nội dung người dùng đã xác nhận sẽ gửi."}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi người dùng đã xác nhận rõ ràng nội dung này; chưa xác nhận thì không gọi send."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
